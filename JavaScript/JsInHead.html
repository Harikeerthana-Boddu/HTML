<!DOCTYPE html>
<html>
    <head>
        <title>Including Java Script in head Tag</title>
    <script>
        function check(){
            confirm("Your JavaScript Code Run");
        }
    </script>
    <style>
        button{
            background-color: chocolate;
            padding: 16px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            color: white;
            width: 100%;
            opacity: 0.9;
        }
        button:hover{
            opacity: 1;
        }
    </style>
    </head>
    <body>
        <form>
            <button type="button" onclick="check()">Click me for running JS Code</button>
        </form>
    </body>
</html>
