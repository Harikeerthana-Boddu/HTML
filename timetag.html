<!DOCTYPE html>
<html>
    <title>
        HTML Time Tag Example
    </title>
    <body>
        <p>We open our shop at <time>09:00</time> am.</p>
        <p>The business meeting is scheduled on <time datetime="2026-11-24">Tuesday</time>.</p>
        <p>The wedding of Krishika sister has scheduled at <time datetime="2026-12-26">12.30pm December 26th</time>.</p>
    </body>
</html>
