<!DOCTYPE html>
<html>
    <head>
        <title>HTML Table body tag</title>
    </head>
    <body>
        <table border="1" style="border-collapse: collapse;">
            <thead>
               <tr><th>Name</th><th>Age</th><th>Address</th></tr>
            </thead>
            <tbody>
                <tr><td>Keerthana</td><td>25</td><td>Kothuru</td></tr>
                <tr><td>Krishika</td><td>4</td><td>Hyderabad</td></tr>
                <tr><td>Kishore</td><td>22</td><td>Wadapally</td></tr>
                <tr><td>Advaita</td><td>2</td><td>Nizamabad</td></tr>
            </tbody>


        </table>
    </body>
</html>
