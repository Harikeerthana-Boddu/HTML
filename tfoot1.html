<!DOCTYPE html>
<html>
    <head>
        <title>HTML tfoot Tag Example</title>
        <style>
            table{
                border-collapse: collapse;
            }
            thead,tfoot{
                background-color:turquoise;

            }
            tbody{
                background-color:lightslategrey;
            }
        </style>
    </head>
    <body>
        <h1>Products List</h1>
        <table>
        <thead>
            <tr><th>Product</th><th>Quantity</th><th>Price</th></tr>
        </thead>
        <tfoot>
            <tr><th>Total</th><th>800</th><th>10000</th></tr>
        </tfoot>
        <tbody>
            
        </tbody>
        </table>
    </body>
</html>
