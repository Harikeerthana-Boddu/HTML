<!DOCTYPE html>
<html>
    <head>
        <title>HTML With Multiple classes</title>
        <style>
        .fruit{
        background-color: crimson;
        color: aliceblue;
        padding: 10px;
        }
        .center{
            text-align: center;
        }
        </style>
    </head>
    <body>
        <h2>Multiple classes</h2>
        <p>All Four elements have the class name "fruit". In addition, Mango also have the class name "center", which center-aligns the text.</p>
        <h2 class="fruit center">Fruits</h2>
        <h2 class="fruit">Mango</h2>
        <h2 class="fruit">Banana</h2>
        <h2 class="fruit">Apple</h2>
    </body>
</html>
