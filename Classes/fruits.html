<!DOCTYPE html>
<html>
    <head>
        <title>HTML Classes with external CSS</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1 class="fruit">Apple</h1>
        <p class="fruit">This is a red apple.</p>
       
        <h1 class="vegetable">Carrot</h1>
        <p class="vegetable">This is an orange carrot.</p>
         <h1 class="fruit">Banana</h1>
        <p class="fruit">This is a yellow banana.</p>
        <h1 class="vegetable">Broccoli</h1>
        <p class="vegetable">This is a green broccoli.</p>
    </body>
</html>
